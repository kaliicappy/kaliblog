- date: 2026-10-17
  text: "i wrote a 'poem' today. <br> there is no outside noise <br> no fan going off at all hours of the day <br> no hum from my laptop <br> no words or laughter in my ears <br> just the sound of my own breathing <br> the sound of my own typing <br> its a lonely silence <br> where time slows and only sounds matter <br> but there are no sounds that matter <br> my own sounds do not matter <br> i hope they matter to you"
- date: 2026-10-17
  text: "i got 4 books today <br> 'The Bell Jar' by Sylvia Plath <br> 'Lolita' by Vladimir Nabokov <br> 'Metamorphosis' by Franz Kafka <br> 'Frankenstein' by Mary Shelley"

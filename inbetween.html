<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>.</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    img {
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <img id="clickImage" src="/assets/images/tree.gif" alt="">
  <audio id="player" autoplay loop src="/assets/audio/inbetween.mp3"></audio>

  <script>
    // Index 0 here corresponds to the "1" key, index 1 to "2", etc.
    const scenes = [
      { image: "/assets/images/tree.gif", song: "/assets/audio/inbetween.mp3" },
      { image: "/assets/images/tree.gif", song: "/assets/audio/inbetween.mp3" },
      { image: "/assets/images/tree2.gif", song: "/assets/audio/inbetween2.mp3" },
      { image: "/assets/images/tree2.png", song: "/assets/audio/inbetween3.mp3" },
      { image: "/assets/images/tree.gif", song: "/assets/audio/inbetween4.mp3" }
    ];

    const player = document.getElementById('player');
    const image = document.getElementById('clickImage');

    document.addEventListener('keydown', (e) => {
      const num = parseInt(e.key, 10);
      if (!isNaN(num) && num >= 1 && num <= scenes.length) {
        const scene = scenes[num - 1];
        player.src = scene.song;
        player.play();
        image.src = scene.image;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}
  <body>
    {%- include header.html -%}

    <div id="planet-widget" style="position: fixed; bottom: 20px; left: 10px; z-index: 100; width: 380px; height: 380px; overflow: hidden; pointer-events: none;">
      <canvas id="canvas" style="width: 380px; height: 380px; display: block;"></canvas>
    </div>
    <div id="legend" style="position: fixed; bottom: 4px; left: 10px; z-index: 100; display: flex; flex-wrap: wrap; max-width: 380px; font-size: 9px; letter-spacing: 1px; gap: 6px 10px;"></div>
    <div id="date-display" style="position: fixed; bottom: -14px; left: 10px; z-index: 100; font-size: 10px;"></div>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <script src="https://tilde.club/~april/planet/data.js"></script>
    <script src="{{ '/assets/js/planet.js' | relative_url }}"></script>

    <script>
      function adjustPlanetWidget() {
        const footer = document.querySelector('.site-footer');
        const widget = document.getElementById('planet-widget');
        const legend = document.getElementById('legend');
        const dateDisplay = document.getElementById('date-display');
        if (!footer || !widget) return;

        const footerTop = footer.getBoundingClientRect().top;
        const viewportHeight = window.innerHeight;
        const overlap = viewportHeight - footerTop;
        const baseOffset = 20;
        const newBottom = overlap > 0 ? baseOffset + overlap : baseOffset;

        widget.style.bottom = newBottom + 'px';
        legend.style.bottom = (newBottom - 16) + 'px';
        dateDisplay.style.bottom = (newBottom - 34) + 'px';
      }

      window.addEventListener('scroll', adjustPlanetWidget);
      window.addEventListener('resize', adjustPlanetWidget);
      adjustPlanetWidget();
    </script>
  </body>
</html>

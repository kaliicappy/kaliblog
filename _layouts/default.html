<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}
  <body>
    {%- include header.html -%}

    <div id="planet-widget" style="position: fixed; bottom: 20px; left: 20px; z-index: 100; display: flex; flex-direction: column; align-items: flex-start; pointer-events: none;">
      <canvas id="canvas" width="220" height="220"></canvas>
      <div id="legend" style="margin-top: 8px; display: flex; flex-wrap: wrap; max-width: 220px; font-size: 9px; letter-spacing: 1px; gap: 6px 10px;"></div>
      <div id="date-display" style="font-size: 10px; margin-top: 4px;"></div>
    </div>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <script src="https://tilde.club/~april/planet/data.js"></script>
    <script src="{{ '/assets/js/planet.js' | relative_url }}"></script>
  </body>
</html>
